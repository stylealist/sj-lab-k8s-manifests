apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mapservice-rest.fullname" . }}
  labels:
    app: {{ include "mapservice-rest.name" . }}
  annotations:
    configmap-checksum: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    service-checksum: {{ include (print $.Template.BasePath "/service.yaml") . | sha256sum }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ include "mapservice-rest.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "mapservice-rest.name" . }}
    spec:
      imagePullSecrets:
        - name: {{ .Values.image.pullSecret }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.env.springProfile }}
            - name: SPRING_CONFIG_LOCATION
              value: {{ .Values.env.springConfigLocation }}
            - name: JAVA_TOOL_OPTIONS
              value: "-Duser.timezone=Asia/Seoul"
            {{- if .Values.qfield }}
            # QFieldCloud 첨부 파일 중계용. Secret 이 없어도 기동되도록 optional 로 둔다.
            - name: QFIELD_BASE_URL
              value: {{ .Values.qfield.baseUrl | quote }}
            - name: QFIELD_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.qfield.secretName }}
                  key: {{ .Values.qfield.usernameKey }}
                  optional: true
            - name: QFIELD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.qfield.secretName }}
                  key: {{ .Values.qfield.passwordKey }}
                  optional: true
            {{- end }}
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config-volume
              mountPath: /app/config
      volumes:
        - name: config-volume
          configMap:
            name: {{ include "mapservice-rest.fullname" . }}-config
