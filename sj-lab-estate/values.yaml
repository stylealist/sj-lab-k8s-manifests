image:
  repository: sj-lab-registry.kr.ncr.ntruss.com/sj-lab-estate
  # Jenkins 가 빌드 후 올려 커밋하는 값이다. 요청 없이 임의로 내리지 말 것.
  tag: 4
  pullSecret: ncp-registry-secret

spring:
  profile: prod

service:
  type: ClusterIP
  port: 8080

env:
  springProfile: prod
  springConfigLocation: "classpath:/,file:/app/config/"

# 부동산 실거래 DB(estate 스키마) 접속. **조회 전용**이다 — 적재는 sj-lab-scheduler 가 한다.
#
#   Secret 을 optional 로 참조한다(없어도 Pod 가 뜬다). 이 서비스는 접속 정보가 없으면
#   조회만 503(NOT_CONFIGURED) 이고 GET /estate/status 는 ready:false 로 답하도록 만들었다 —
#   기동을 막으면 화면이 "준비되지 않았다"조차 알릴 수 없기 때문이다.
#   그래서 Secret 이 아직 없어도 배포는 성공하고, 화면에 안내만 뜬다.
#
#   **2026-10-13: 새 Secret 을 만들지 않고 공개 API 의 openapi-db-credentials 를 그대로 쓴다.**
#   같은 DB(sjlab)를 가리키고 키 이름(url·username·password)도 같아서 그대로 참조할 수 있다.
#   대신 그 Secret 의 계정(openapi_svc)은 공개 API 용으로 만들어져 **estate 권한이 없으므로**,
#   읽기 권한을 주는 SQL 을 한 번 실행해야 한다 — sj-lab/db/estate/estate_grant_openapi_svc.sql
#   (실행 전에는 /estate/status 가 reason: CONNECT_FAILED 로 답하고 조회만 막힌다).
#
#   알고 쓸 점: 두 서비스가 DB 계정을 공유하게 되므로 **비밀번호를 바꾸면 둘 다 영향**을 받는다.
#   계정을 분리하려면 전용 계정(db/estate/estate_read_role.sql 의 estate_read)을 만들고
#   secretName 을 estate-db-credentials 로 되돌린 뒤 그 Secret 을 만들면 된다
#   (만드는 스크립트: sj-lab/scripts/create-estate-db-secret.ps1).
db:
  secretName: openapi-db-credentials
  urlKey: url
  usernameKey: username
  passwordKey: password
  # 조회 전용이라 커넥션을 많이 쓸 필요가 없다.
  poolSize: 5

fullnameOverride: sj-lab-estate
