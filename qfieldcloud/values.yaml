# =============================================
# QFieldCloud Helm Chart - values.yaml
# =============================================

# -- Global namespace override
namespaceOverride: ""

# =============================================
# Image settings
# =============================================
image:
  app:
    repository: opengisch/qfieldcloud-app
    tag: "latest"
    pullPolicy: IfNotPresent
  nginx:
    repository: opengisch/qfieldcloud-nginx
    tag: "latest"
    pullPolicy: IfNotPresent
  qgis:
    repository: opengisch/qfieldcloud-qgis
    tag: "latest"
    pullPolicy: IfNotPresent

imagePullSecrets: []

# =============================================
# Django / App settings
# =============================================
django:
  debug: "0"
  environment: "production"
  secretKey: "change_me_use_pwgen_sn_128"
  saltKey: "0123456789abcdefghijklmnopqrstuvwxyz"
  allowedHosts: "*"
  useXForwardedHost: "1"
  settingsModule: "qfieldcloud.settings"
  adminUri: "admin/"
  subscriptionModel: "subscription.Subscription"
  accountAdapter: "qfieldcloud.core.adapters.AccountAdapterSignUpOpen"
  passwordLoginEnabled: "1"
  authTokenExpirationHours: "720"
  useI18n: "1"
  defaultLanguage: "en"
  defaultTimeZone: "Asia/Seoul"
  accountEmailVerification: "optional"
  socialaccountProviders: "{}"
  corsAllowedOrigins: "https://docs.qfield.org"
  corsAllowCredentials: "1"

# Gunicorn settings
gunicorn:
  timeoutS: "300"
  maxRequests: "300"
  workers: "3"
  threads: "3"

# =============================================
# App Deployment
# =============================================
app:
  replicas: 1
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  annotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# =============================================
# Worker (worker_wrapper) settings
# =============================================
worker:
  replicas: 1
  qfieldcloudUrl: "http://qfieldcloud-app:8000/api/v1/"
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "2000m"
      memory: "2Gi"
  annotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# =============================================
# Nginx settings
# =============================================
nginx:
  replicas: 1
  clientMaxBodySize: "10g"
  proxyConnectTimeout: "5s"
  proxyReadTimeout: "300s"
  proxySendTimeout: "300s"
  errorLogLevel: "error"
  allowInternalHttp: "1"  # In k8s we handle TLS at ingress level
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

# =============================================
# PostgreSQL (external)
# =============================================
postgres:
  host: "postgres-postgresql.database.svc.cluster.local"
  port: "5432"
  database: "qfieldcloud"
  username: "qfieldcloud"
  password: "changeme"
  sslmode: "prefer"
  # Use existing secret instead of plain password
  existingSecret: ""
  existingSecretPasswordKey: "password"

# =============================================
# Redis
# =============================================
redis:
  host: "redis-master.redis.svc.cluster.local"
  port: "6379"
  password: ""
  existingSecret: ""
  existingSecretPasswordKey: "redis-password"

# =============================================
# Object Storage (MinIO / S3)
# =============================================
storage:
  accessKey: "minio"
  secretKey: "minio123"
  bucketName: "qfieldcloud"
  regionName: ""
  endpointUrl: "http://minio.minio.svc.cluster.local:9000"
  isLegacy: "false"
  existingSecret: ""
  existingSecretAccessKeyKey: "accessKey"
  existingSecretSecretKeyKey: "secretKey"

# =============================================
# Email settings
# =============================================
email:
  host: "smtp4dev"
  port: "25"
  useTls: "False"
  useSsl: "False"
  user: "user"
  password: "password"
  defaultFrom: "webmaster@localhost"
  existingSecret: ""
  existingSecretPasswordKey: "password"

# =============================================
# Sentry (optional)
# =============================================
sentry:
  dsn: ""
  sampleRate: "1"
  release: "prod"

# =============================================
# Ingress
# =============================================
ingress:
  enabled: true
  className: "nginx"
  host: "qfield.example.com"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10g"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
  tls:
    enabled: false
    secretName: "qfieldcloud-tls"

# =============================================
# Persistent Volume Claims
# =============================================
persistence:
  static:
    enabled: true
    storageClassName: "nfs-client"
    size: "5Gi"
    accessMode: ReadWriteMany
    existingClaim: ""
  media:
    enabled: true
    storageClassName: "nfs-client"
    size: "20Gi"
    accessMode: ReadWriteMany
    existingClaim: ""
  transformationGrids:
    enabled: true
    storageClassName: "nfs-client"
    size: "10Gi"
    accessMode: ReadWriteMany
    existingClaim: ""

# =============================================
# Service accounts
# =============================================
serviceAccount:
  create: true
  annotations: {}
  name: ""

# =============================================
# Migration job (runs before app starts)
# =============================================
migrations:
  enabled: true
  # collectstatic + migrate
  command:
    - /bin/sh
    - -c
    - |
      python manage.py wait_for_db &&
      python manage.py migrate --no-input &&
      python manage.py collectstatic --no-input

# =============================================
# Cronjob (runcrons)
# =============================================
cronjob:
  enabled: true
  schedule: "* * * * *"  # every 1 minute
  command:
    - python
    - manage.py
    - runcrons
