apiVersion: v1
kind: Service
metadata:
  name: {{ include "qfieldcloud.fullname" . }}-app
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qfieldcloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    {{- include "qfieldcloud.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
