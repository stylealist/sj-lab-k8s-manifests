{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "qfieldcloud.fullname" . }}-migrate-{{ .Release.Revision }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qfieldcloud.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    # ArgoCD hook: run before sync completes
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "qfieldcloud.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "qfieldcloud.serviceAccountName" . }}
      initContainers:
        - name: wait-for-db
          image: busybox:1.35
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for PostgreSQL..."
              until nc -z {{ .Values.postgres.host }} {{ .Values.postgres.port }}; do
                echo "PostgreSQL not ready, waiting..."
                sleep 3
              done
              echo "PostgreSQL is ready!"
      containers:
        - name: migrate
          image: "{{ .Values.image.app.repository }}:{{ .Values.image.app.tag }}"
          imagePullPolicy: {{ .Values.image.app.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              python manage.py migrate --no-input &&
              python manage.py collectstatic --no-input
          env:
            {{- include "qfieldcloud.djangoEnv" . | nindent 12 }}
          volumeMounts:
            - name: static
              mountPath: /usr/src/app/staticfiles
            - name: media
              mountPath: /usr/src/app/mediafiles
      volumes:
        - name: static
          {{- if .Values.persistence.static.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.static.existingClaim }}
          {{- else if .Values.persistence.static.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "qfieldcloud.fullname" . }}-static
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: media
          {{- if .Values.persistence.media.existingClaim }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.media.existingClaim }}
          {{- else if .Values.persistence.media.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "qfieldcloud.fullname" . }}-media
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
