# =============================================
# values-prod.yaml
# Production 환경 오버라이드 값
# 이 파일은 values.yaml을 오버라이드합니다.
# =============================================

image:
  app:
    repository: opengisch/qfieldcloud-app
    tag: "latest"        # 실제 배포 시 반드시 특정 버전으로 고정하세요 (e.g. "v2.8.0")
    pullPolicy: IfNotPresent
  nginx:
    repository: nginx
    tag: "stable"
    pullPolicy: IfNotPresent
  qgis:
    repository: opengisch/qfieldcloud-qgis
    tag: "latest"

django:
  debug: "0"
  environment: "production"
  # ⚠️  보안: 실제 운영에서는 반드시 변경하세요
  # 권장: kubectl create secret generic qfieldcloud-secret 으로 별도 관리
  secretKey: "CHANGE_ME_USE_PWGEN_SN_128"
  saltKey: "CHANGE_ME_USE_PWGEN_SN_128"
  allowedHosts: "qfield.example.com"
  accountEmailVerification: "optional"
  defaultTimeZone: "Asia/Seoul"
  corsAllowedOrigins: "https://qfield.example.com"

gunicorn:
  workers: "4"
  threads: "4"

app:
  replicas: 2
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "2Gi"

worker:
  replicas: 2
  qfieldcloudUrl: "http://qfieldcloud-app:8000/api/v1/"
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "4000m"
      memory: "4Gi"

nginx:
  replicas: 2

# =============================================
# PostgreSQL - 외부 PostgreSQL 사용
# =============================================
postgres:
  host: "postgres-postgresql.database.svc.cluster.local"
  port: "5432"
  database: "qfieldcloud"
  username: "qfieldcloud"
  password: "changeme"    # ⚠️ 실제 운영에서는 반드시 변경하세요
  sslmode: "prefer"

# =============================================
# Redis - 외부 Redis 사용
# =============================================
redis:
  host: "redis-master.redis.svc.cluster.local"
  port: "6379"

# =============================================
# MinIO / S3 Object Storage
# =============================================
storage:
  accessKey: "minio"
  secretKey: "minio123"   # ⚠️ 실제 운영에서는 반드시 변경하세요
  bucketName: "qfieldcloud"
  regionName: ""
  endpointUrl: "http://minio.minio.svc.cluster.local:9000"
  isLegacy: "false"

# =============================================
# Email - SMTP 설정
# =============================================
email:
  host: "smtp.example.com"
  port: "587"
  useTls: "True"
  useSsl: "False"
  user: "noreply@example.com"
  password: "smtp-password"  # ⚠️ 실제 운영에서는 반드시 변경하세요
  defaultFrom: "noreply@example.com"

# =============================================
# Ingress
# =============================================
ingress:
  enabled: true
  className: "nginx"
  host: "qfield.example.com"   # ⚠️ 실제 도메인으로 변경하세요
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10g"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
    # cert-manager 사용 시 주석 해제:
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
  tls:
    enabled: false    # cert-manager 사용 시 true로 변경
    secretName: "qfieldcloud-tls"

# =============================================
# PVC - NFS StorageClass 사용
# =============================================
persistence:
  static:
    enabled: true
    storageClassName: "nfs-client"
    size: "5Gi"
    accessMode: ReadWriteMany
  media:
    enabled: true
    storageClassName: "nfs-client"
    size: "50Gi"
    accessMode: ReadWriteMany
  transformationGrids:
    enabled: true
    storageClassName: "nfs-client"
    size: "10Gi"
    accessMode: ReadWriteMany
