server {
    listen 80;
    server_name sj-lab.co.kr www.sj-lab.co.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    error_page 404 /custom_404.html;
    error_page 500 502 503 504 /custom_50x.html;

    location = /custom_404.html {
        root /home;
        internal;
    }

    location = /custom_50x.html {
        root /home;
        internal;
    }

    root /home/www;
    index index.html;

    # API 활용 페이지(sj-lab-openapi-web). 이 경로의 파일이 없으면 404 를 내보낸다 —
    # 아래 location / 의 SPA 폴백을 타면 허브 화면이 200 으로 나와 "배포가 됐는지" 헷갈린다
    # (지도 /map 에서 실제로 겪은 문제, mapservice-rest/docs/deploy-static-sites.md 참고).
    location /openapi/ {
        try_files $uri $uri/ /openapi/index.html =404;
    }

    location / {
	    try_files $uri $uri/ /index.html;
	    add_header X-SJ-Test "Nginx Config Applied OK";
    }
}
