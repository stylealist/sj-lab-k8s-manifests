#test
image:
  #repository: kartoza/geoserver
  repository: docker.osgeo.org/geoserver
  tag: 2.25.0
  #tag: 2.24.0
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 8080
  nodePort: 32180  # 로컬 NGINX에서 reverse proxy할 노드포트 번호

resources: {}

persistence:
  enabled: false
  #storageClass: "manual"
  #accessMode: ReadWriteOnce
  #size: 5Gi

# 호스트 경로(노드) ↔ 컨테이너 데이터 디렉터리 연결
hostPath:
  enabled: true
  path: /home/kuber-volume/geoserver-workspace  # 로컬 호스트 경로

# 컨테이너 내부 데이터 디렉터리 경로
dataDir:
  mountPath: /opt/geoserver_data

env:
  - name: PROXY_BASE_URL
    value: https://geoserver.sj-lab.co.kr/geoserver
  - name: TZ
    value: "Asia/Seoul"
  # -XX:-UseBASE64Intrinsics : CVE-2026-114938(Java4Shell) 임시 완화 — OpenJDK 17.0.6+ x86-64(AVX-512 VBMI)
  # 의 Base64 디코드 인트린식 결함. **패치된 JDK 이미지로 재빌드하면 이 옵션은 빼는 것이 맞다**(Base64 성능).
  # 같은 이름의 환경변수를 따로 또 두면 뒤엣것만 남아 타임존이 날아가므로 한 값에 이어 붙인다.
  - name: JAVA_TOOL_OPTIONS
    value: "-Duser.timezone=Asia/Seoul -XX:-UseBASE64Intrinsics"
  - name: GEOSERVER_CSRF_WHITELIST
    value: "geoserver.sj-lab.co.kr"

# values.yaml (추가)
cors:
  enabled: true
  webXmlPath: "/usr/local/tomcat/webapps/geoserver/WEB-INF/web.xml"  # Tomcat
  # 쉼표 뒤에 공백 없이! (필터 구현에 따라 공백도 문자열로 인식될 수 있음)
  allowedOrigins: "https://sj-lab.co.kr,http://localhost:4000,https://www.sj-lab.co.kr"
  allowedMethods: "GET,POST,OPTIONS,HEAD"
  allowedHeaders: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
  exposedHeaders: "Content-Length,Content-Range"