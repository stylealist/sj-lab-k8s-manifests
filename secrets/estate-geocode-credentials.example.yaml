# 아파트 단지 좌표(지오코딩)용 외부 API 키 — **값은 비워 둔 틀**이다.
#
# 쓰는 곳: sj-lab-scheduler 의 /scheduler/estate/complex/geocode
#   juso-confm-key : 행안부 좌표제공 API 승인키(필수). 없으면 "키 없음"만 답하고 아무것도 안 한다
#   vworld-api-key : VWorld 지오코더 인증키(보조). 없으면 행안부 경로만 쓴다
#
# **주의**
#   - 이 저장소는 public 이다. 값을 채운 파일을 커밋하지 말 것(채운 사본은 로컬에만 둔다).
#   - VWorld 키는 **발급할 때 적은 사용 URL 에 묶인다** — 로컬용과 운영용이 서로 다른 값이다.
#     로컬 값은 sj-lab/.claude/settings.local.json 의 env 에 둔다(여기 말고).
#   - 이 파일은 어느 차트에도 들어 있지 않다(Helm 이 렌더링하지 않는다). 손으로 한 번 적용한다.
#     차트에 넣으면 배포할 때마다 빈 값이 덮어써서 운영 키가 지워진다.
#
# 적용
#   kubectl apply -f estate-geocode-credentials.example.yaml   (값을 채운 사본으로)
# 또는 파일 없이 바로
#   kubectl -n sj-lab create secret generic estate-geocode-credentials \
#     --from-literal=juso-confm-key=... --from-literal=vworld-api-key=...
#
# 이 Secret 을 쓰려면 sj-lab-scheduler 차트의 deployment.yaml env 에 아래를 더한다(둘 다 optional).
#   - name: JUSO_CONFM_KEY
#     valueFrom: { secretKeyRef: { name: estate-geocode-credentials, key: juso-confm-key, optional: true } }
#   - name: VWORLD_API_KEY
#     valueFrom: { secretKeyRef: { name: estate-geocode-credentials, key: vworld-api-key, optional: true } }
apiVersion: v1
kind: Secret
metadata:
  name: estate-geocode-credentials
  namespace: sj-lab
type: Opaque
stringData:
  juso-confm-key: "U01TX0FVVEgyMDI2MTAxNTEzNTkzODEyMDcxMjk="
  vworld-api-key: "9F9FB959-3CBE-48C8-951E-3190638ACD64"
