image:
  repository: sj-lab-registry.kr.ncr.ntruss.com/sj-lab-openapi
  tag: 6
  pullSecret: ncp-registry-secret

spring:
  profile: prod

service:
  type: ClusterIP
  port: 8080

env:
  springProfile: prod
  springConfigLocation: "classpath:/,file:/app/config/"

# 데이터는 DB 를 직접 읽지 않고 mapservice-rest 를 호출해 중계한다(Eureka 서비스 이름).
upstream:
  baseUrl: http://MAPSERVICE-REST

# 로그인 확인(키 발급 화면)은 authserver 에 위임한다.
auth:
  baseUrl: http://SJ-LAB-AUTHSERVER

# API 키·사용량 기능.
#   enabled: false 면 DB 없이 뜨고 키 API 만 503, 공개 API 조회는 정상이다.
#   켜기 전에 두 가지가 먼저 필요하다.
#     1) 표 생성 — sj-lab 저장소의 db/api/openapi_api_key.sql, db/api/openapi_api_usage.sql (DB 담당자가 실행)
#        표는 api 스키마에 만든다(api.openapi_api_key, api.openapi_api_usage).
#     2) Secret 생성 — 값은 차트에 평문으로 적지 말 것
#        kubectl create secret generic openapi-db-credentials -n sj-lab \
#          --from-literal=url='jdbc:postgresql://<호스트>:5432/sjlab' \
#          --from-literal=username='<계정>' --from-literal=password='<비밀번호>'
#   enabled: true 인데 Secret 이 없으면 접속 주소가 비어 기동이 실패한다(의도된 동작).
apiKey:
  enabled: false
  dailyQuota: 1000
  secretName: openapi-db-credentials
  urlKey: url
  usernameKey: username
  passwordKey: password

fullnameOverride: sj-lab-openapi
